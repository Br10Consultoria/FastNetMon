[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastnetmon-combined-filters"
version = "0.3.0"
description = "OrbyMon: filtros DDoS combinados, ASN/Geo, Grafana e incidentes (POC)"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
geo = ["geoip2>=4.8,<6"]
mysql = ["PyMySQL>=1.1,<2"]
full = ["geoip2>=4.8,<6", "PyMySQL>=1.1,<2"]

[project.scripts]
fmn-filters = "fmn_filters.__main__:main"
orbymon-enrich = "fmn_filters.enrich_stream:main"
orbymon-mysql-sink = "fmn_filters.mysql_sink:main"
orbymon-incidents = "fmn_filters.incidents:main"

[tool.setuptools.packages.find]
where = ["src"]
