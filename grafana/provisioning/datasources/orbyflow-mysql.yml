apiVersion: 1
deleteDatasources:
  - name: OrbyMon MariaDB
    orgId: 1
datasources:
  - name: OrbyFlow MariaDB
    uid: orbyflow-mysql
    type: mysql
    access: proxy
    url: ${ORBYMON_DB_HOST}:3306
    user: ${ORBYMON_DB_USER}
    isDefault: false
    jsonData:
      database: ${ORBYMON_DB_NAME}
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${ORBYMON_DB_PASSWORD}
