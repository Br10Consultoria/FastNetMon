{% extends "base.html" %}{% block title %}Entrar{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Entrar</h1>
  <form method="post" autocomplete="off">
    {% include "_csrf.html" %}
    <label>Usuário <input name="username" required maxlength="40" autofocus autocapitalize="none"></label>
    <label>Senha <input name="password" type="password" required autocomplete="current-password"></label>
    <button>Continuar</button>
  </form>
</section>
{% endblock %}
