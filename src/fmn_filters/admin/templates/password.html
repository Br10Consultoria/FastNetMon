{% extends "base.html" %}{% block title %}Senha{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Alterar senha</h1>
  {% if g.user.must_change_password %}<p class="warn">Defina uma senha nova antes de continuar.</p>{% endif %}
  <form method="post" autocomplete="off">
    {% include "_csrf.html" %}
    <label>Senha atual <input name="current" type="password" required autocomplete="current-password"></label>
    <label>Senha nova (mínimo 12 caracteres) <input name="new" type="password" required minlength="12" autocomplete="new-password"></label>
    <label>Confirme <input name="confirm" type="password" required minlength="12" autocomplete="new-password"></label>
    <button>Salvar</button>
  </form>
</section>
{% endblock %}
