name: Testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Testes sem dependencias
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validar regras
        run: PYTHONPATH=src python -m fmn_filters --rules rules/example-rules.json --validate
      - name: Validar replay de incidentes (sem rede)
        run: bash scripts/test-incidents.sh
